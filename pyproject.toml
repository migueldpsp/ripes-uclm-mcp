[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripes-uclm-mcp"
version = "0.1.0"
description = "MCP server to drive an unmodified UCLM Ripes (RISC-V simulator) window live on Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "pillow>=10",
]

[project.scripts]
ripes-uclm-mcp = "ripes_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
